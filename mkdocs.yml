site_name: Glosario DAW
site_description: Glosario personal de Desarrollo de Aplicaciones Web (DAW), nivel principiante.
site_author: Glosario DAW
repo_url: https://github.com/ifonlob/GlosarioDAW
repo_name: ifonlob/GlosarioDAW
edit_uri: edit/main/

docs_dir: docs

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Cambiar a modo claro
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Volver al modo automático
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - header.autohide

plugins:
  - search:
      lang: es
  - mermaid2:
      arguments:
        theme: |
          ^(JSON.parse(window.localStorage.getItem('mkdocs-material:theme')) === 'dark' ? 'dark' : 'neutral')
  - minify:
      minify_html: false   # minify_html rompe Mermaid (quita los saltos de línea)
      minify_css: true
      minify_js: true
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
      title: Índice
  - pymdownx.details
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ifonlob/GlosarioDAW
  generator: false

nav:
  - Inicio: index.md
  - Glosario: glosario.md
  # >>> nav: resúmenes (generado por scripts/generate_indexes.py) >>>
  - Resúmenes:
      - Resúmenes por temas: resumenes.md
      - "HTTP y protocolo":
          - "Cabeceras HTTP, contenido, caché y negociación": resumenes/cabeceras-http-contenido-y-cache.md
          - "Estados de respuesta HTTP: interpretar lo que devuelve una API": resumenes/estados-http.md
          - "Método HTTP QUERY y consultas con contenido": resumenes/query-http.md
          - "Métodos HTTP: GET, POST, PUT, PATCH, DELETE, HEAD y OPTIONS": resumenes/metodos-http.md
          - "Versiones y estructura de los mensajes HTTP": resumenes/versiones-y-mensajes-http.md
      - "Cliente, servidor e infraestructura":
          - "Cliente, servidor y contenido dinámico": resumenes/cliente-servidor-contenido-dinamico.md
          - "Cómo llega HTTP al código servidor": resumenes/mecanismos-ejecucion-servidor.md
          - "Elegir tecnologías e integrar respuestas": resumenes/tecnologias-e-integracion.md
          - "Servidores web, proxies y contenedores": resumenes/infraestructura-web.md
      - "Spring Boot y Java (DWES)":
          - "Capa de servicio": resumenes/capa-servicios.md
          - "Introducción a Spring Boot": resumenes/introduccion-spring-boot.md
          - "Spring Boot y controladores REST": resumenes/controladores-rest.md
      - "TDD y pruebas":
          - "TDD mínimo para el cuestionario de entorno": resumenes/tdd-minimo.md
          - "TDD y MockMvc en la mini API Tasks": resumenes/tdd-primeros-pasos.md
          - "Tests de errores y respuestas HTTP coherentes": resumenes/tdd-manejo-errores.md
# <<< nav: resúmenes <<<
  - Términos: terminos.md
  - Categorías: categorias.md
  - Etiquetas: etiquetas.md
  - Sobre el glosario: sobre.md
